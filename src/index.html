<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scriptly</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/shell.css" />
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body data-theme="paper">
  <section class="login-screen" id="loginScreen">
    <div class="login-copy">
      <p class="kicker">Scriptly</p>
      <h1>Scriptly</h1>
      <p>素材、规则、版本和导出，放进一条清爽的创作工作流。</p>
    </div>

    <form class="login-card" id="loginForm">
      <p class="section-label">Account</p>
      <h2>登录</h2>
      <label>账号<select id="loginAccount"></select></label>
      <label>密码<input type="password" value="prototype" /></label>
      <button class="button filled wide" type="submit">进入</button>
    </form>
  </section>

  <div class="app-shell hidden" id="appShell">
    <aside class="side-rail">
      <section class="rail-brand">
        <span class="logo-mark">S</span>
        <div><strong>Scriptly</strong><small>AI script workspace</small></div>
      </section>

      <nav class="rail-nav" aria-label="主导航">
        <button class="active" data-nav="work">新建项目</button>
        <button data-nav="projects">项目库</button>
        <button data-nav="admin" data-admin-only>后台</button>
      </nav>

      <section class="rail-system" aria-label="系统">
        <button class="system-link" data-nav="settings" type="button">设置</button>
        <button class="account-card" data-nav="settings" type="button">
          <span class="account-avatar" id="railAccountInitial">管</span>
          <span class="account-copy">
            <small>当前账户</small>
            <strong id="railAccountName">管理员</strong>
            <em id="railAccountType">管理员</em>
          </span>
        </button>
      </section>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="brand-lockup">
          <strong id="stageTitle">新建项目</strong>
          <span id="stageText">上传素材，配置规则，生成第一版脚本</span>
        </div>
        <div class="top-actions">
          <div class="theme-picker" aria-label="主题色">
            <button data-theme="paper" class="active" title="Paper Green"></button>
            <button data-theme="mineral" title="Mineral Blue"></button>
            <button data-theme="ink" title="Ink Plum"></button>
            <button data-theme="sand" title="Muted Sand"></button>
          </div>
          <button class="chip button-chip" id="topRuleBtn" type="button">默认规则</button>
        </div>
      </header>

      <section class="view active" id="workView">
        <div class="studio-grid">
          <section class="panel composer-panel">
            <div class="panel-head">
              <div>
                <p class="section-label">New Project</p>
                <h2>新建项目</h2>
              </div>
              <button class="button small" id="resetProjectBtn" type="button">清空</button>
            </div>

            <label class="field-label">项目名称<input id="projectNameInput" value="新客户脚本" /></label>

            <section class="upload-zone" id="uploadZone">
              <div><strong>上传素材 / 文件</strong><span>brief、会议纪要、参考文案、客户说明</span></div>
              <button class="button small" id="uploadMaterialBtn" type="button">添加</button>
            </section>
            <div class="file-list" id="fileList"></div>

            <label class="field-label material-field">客户素材<textarea id="sourceText" spellcheck="false" placeholder="粘贴客户描述、会议纪要、已有脚本或文件摘要..."></textarea></label>

            <div class="generation-bar">
              <select id="modelSelect" aria-label="模型选择"></select>
              <button class="button soft" id="ruleButton" type="button">规则 / Prompt</button>
              <button class="button filled" id="generateBtn" type="button">生成脚本</button>
            </div>
          </section>

          <section class="panel preview-panel">
            <div class="script-head">
              <div>
                <p class="section-label" id="scriptState">Draft</p>
                <h2>脚本预览</h2>
              </div>
              <div class="compact-actions">
                <button class="button small" id="tuneBtn" type="button">调校</button>
                <button class="button small" id="saveScriptBtn" type="button">保存</button>
                <button class="button filled small" id="exportBtn" type="button">导出</button>
              </div>
            </div>
            <div class="script-list" id="scriptList"></div>
            <div class="version-bar" id="versionBar"></div>
          </section>
        </div>
      </section>

      <section class="view" id="projectsView">
        <div class="projects-grid">
          <section class="panel projects-panel">
            <div class="panel-head">
              <div><p class="section-label">Projects</p><h2>项目库</h2></div>
              <button class="button filled small" id="newProjectBtn" type="button">新建</button>
            </div>
            <div class="library-toolbar"><input id="projectSearch" placeholder="搜索项目" /></div>
            <div class="project-list" id="projectList"></div>
          </section>
          <aside class="panel project-detail" id="projectDetail"></aside>
        </div>
      </section>

      <section class="view" id="settingsView">
        <section class="panel profile-panel" id="profilePanel"></section>
      </section>

      <section class="view" id="adminView">
        <section class="panel admin-panel" id="adminPanel"></section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-layer hidden" id="modalLayer" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
      <p class="section-label" id="modalKicker">Action</p>
      <h2 id="modalTitle"></h2>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
